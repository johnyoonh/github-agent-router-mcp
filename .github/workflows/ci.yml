name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@0c54c7b07420dcba69a7d832587f55ebdf771c9e # official main, 2026-09-24
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
